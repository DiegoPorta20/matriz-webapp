# La imagen nginx-unprivileged corre como uid 101 y por eso escucha en 8080:
# un proceso sin privilegios no puede abrir el puerto 80.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Los headers de security.md, declarados una sola vez.
    #
    # Ningun bloque location usa add_header, y es deliberado: en nginx, un
    # add_header en un nivel anidado descarta todos los del nivel superior. Por eso
    # la cache se controla con `expires`, que emite Cache-Control por su cuenta.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # style-src permite inline porque Angular inyecta estilos en tiempo de
    # ejecucion. script-src no lo necesita: el bundle se sirve como fichero.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Sonda del contenedor. No sirve la SPA para no depender del bundle.
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # El frontend usa rutas relativas y nginx las reenvia a go-api. Asi la URL del
    # backend no se hornea en el bundle y no hace falta CORS entre contenedores.
    location /api/ {
        proxy_pass http://go-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Holgado respecto al timeout de go-api hacia node-api, para que el
        # cliente reciba el 502 del gateway en lugar de un corte de nginx.
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Los ficheros llevan hash en el nombre, asi que su contenido no cambia nunca.
    location ~* \.(?:js|css|woff2|svg|ico|png|jpg)$ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html no se cachea: es lo que apunta a los bundles nuevos tras un
    # despliegue.
    location = /index.html {
        expires -1;
    }

    # Cualquier otra ruta la resuelve el router de Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
