name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  verify:
    name: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests con cobertura
        run: npm run test:ci

      - name: Compilar
        run: npm run build

  image:
    name: imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: desplegar
    needs: [verify, image]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Construir la SPA
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Validar configuración de despliegue AWS
        run: |
          set -euo pipefail
          if [ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "Usando autenticación OIDC para AWS."
          elif [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "Usando credenciales estáticas de AWS."
          else
            echo "No hay configuración válida de AWS para el despliegue."
            echo "Define una de estas opciones en GitHub:" 
            echo "  - Variable: AWS_DEPLOY_ROLE_ARN (OIDC)"
            echo "  - Secrets: AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY"
            exit 1
          fi

      - name: Autenticar en AWS con OIDC
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-frontend-${{ github.run_id }}

      - name: Autenticar en AWS con credenciales estáticas
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN == '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Subir los ficheros con hash
        run: |
          aws s3 sync dist/frontend/browser "s3://${{ vars.S3_BUCKET }}" \
            --exclude index.html \
            --cache-control 'public, max-age=31536000, immutable' \
            --delete

      - name: Subir index.html sin cachear
        run: |
          aws s3 cp dist/frontend/browser/index.html \
            "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control 'no-cache, no-store, must-revalidate'

      - name: Invalidar CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id '${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}' \
            --paths '/index.html' '/' \
            --no-cli-pager

  smoke:
    name: smoke test
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: La SPA se sirve
        run: |
          curl -fsS --retry 5 --retry-delay 5 -o /dev/null \
            "${{ vars.PUBLIC_BASE_URL }}/"

      - name: Una ruta profunda devuelve la SPA y no un 404
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' \
            "${{ vars.PUBLIC_BASE_URL }}/factorization")
          echo "GET /factorization -> $codigo"
          [ "$codigo" = "200" ] || exit 1

      - name: Los headers de seguridad estan presentes
        run: |
          set -euo pipefail
          headers=$(curl -sI "${{ vars.PUBLIC_BASE_URL }}/")
          for h in x-content-type-options x-frame-options referrer-policy content-security-policy; do
            echo "$headers" | grep -qi "^$h:" || { echo "Falta el header $h"; exit 1; }
          done
          echo "Los headers de seguridad estan presentes"

      - name: La SPA puede llamar a la API desde su origen
        run: |
          set -euo pipefail
          respuesta=$(curl -sI -X OPTIONS "${{ vars.API_BASE_URL }}/factorization" \
            -H "Origin: ${{ vars.PUBLIC_BASE_URL }}" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type')

          echo "$respuesta" | grep -qi 'access-control-allow-origin' \
            || { echo "go-api no permite el origen ${{ vars.PUBLIC_BASE_URL }}"; exit 1; }

          echo "CORS configurado correctamente"
