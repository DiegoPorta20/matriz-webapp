name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
  S3_BUCKET: ${{ vars.S3_BUCKET || secrets.S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID || secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  GO_API_URL: ${{ vars.GO_API_URL || vars.API_BASE_URL || vars.PUBLIC_API_URL || secrets.GO_API_URL || secrets.API_BASE_URL || secrets.PUBLIC_API_URL || '' }}
  API_BASE_URL: ${{ vars.GO_API_URL || vars.API_BASE_URL || vars.PUBLIC_API_URL || secrets.GO_API_URL || secrets.API_BASE_URL || secrets.PUBLIC_API_URL || '' }}
  PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || secrets.PUBLIC_BASE_URL || '' }}

jobs:
  verify:
    name: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests con cobertura
        run: npm run test:ci

      - name: Compilar
        run: npm run build

  image:
    name: imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: desplegar
    needs: [verify, image]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validar URL pública de la API
        run: |
          set -euo pipefail
          if [ -z "${GO_API_URL:-}" ]; then
            echo "Falta la variable GO_API_URL en GitHub Actions (Variables o Secrets)."
            echo "Pon aquí la URL pública real del backend Go, por ejemplo https://tu-dominio.com/api/v1"
            exit 1
          fi

      - name: Construir la SPA
        env:
          API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Validar variables de despliegue
        run: |
          set -euo pipefail
          if [ -z "$S3_BUCKET" ]; then
            echo "Falta la variable S3_BUCKET en GitHub Actions (Variables o Secrets)."
            exit 1
          fi
          if [ -z "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "Falta la variable CLOUDFRONT_DISTRIBUTION_ID en GitHub Actions (Variables o Secrets)."
            exit 1
          fi

      - name: Autenticar en AWS con OIDC
        if: ${{ env.AWS_DEPLOY_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-frontend-${{ github.run_id }}

      - name: Autenticar en AWS con credenciales estáticas
        if: ${{ env.AWS_DEPLOY_ROLE_ARN == '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar autenticación AWS
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/dev/null

      - name: Subir los ficheros con hash
        run: |
          aws s3 sync dist/frontend/browser "s3://$S3_BUCKET" \
            --exclude index.html \
            --cache-control 'public, max-age=31536000, immutable' \
            --delete

      - name: Subir index.html sin cachear
        run: |
          aws s3 cp dist/frontend/browser/index.html \
            "s3://$S3_BUCKET/index.html" \
            --cache-control 'no-cache, no-store, must-revalidate'

      - name: Invalidar CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/index.html' '/' \
            --no-cli-pager

  smoke:
    name: smoke test
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: La SPA se sirve
        run: |
          curl -fsS --retry 5 --retry-delay 5 -o /dev/null \
            "$PUBLIC_BASE_URL/"

      - name: Una ruta profunda devuelve la SPA y no un 404
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' \
            "$PUBLIC_BASE_URL/factorization")
          echo "GET /factorization -> $codigo"
          [ "$codigo" = "200" ] || exit 1

      - name: Los headers de seguridad estan presentes
        run: |
          set -euo pipefail
          headers=$(curl -sI "$PUBLIC_BASE_URL/")
          for h in x-content-type-options x-frame-options referrer-policy content-security-policy; do
            echo "$headers" | grep -qi "^$h:" || { echo "Falta el header $h"; exit 1; }
          done
          echo "Los headers de seguridad estan presentes"

      - name: La SPA puede llamar a la API desde su origen
        run: |
          set -euo pipefail
          respuesta=$(curl -sI -X OPTIONS "$GO_API_URL/factorization" \
            -H "Origin: $PUBLIC_BASE_URL" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type')

          echo "$respuesta" | grep -qi 'access-control-allow-origin' \
            || { echo "go-api no permite el origen $PUBLIC_BASE_URL"; exit 1; }

          echo "CORS configurado correctamente"
