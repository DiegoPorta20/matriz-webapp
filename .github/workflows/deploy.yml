name: Deploy

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '22'

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Construir la SPA
        # Sin variables de entorno, y es deliberado: la aplicacion usa rutas
        # relativas y quien decide a donde van es CloudFront. El mismo bundle
        # sirve en cualquier entorno.
        #
        # Una SPA no tiene entorno de servidor: cualquier valor que se le
        # inyectara acabaria dentro del JavaScript y seria publico.
        run: |
          npm ci
          npm run build

      - name: Autenticar en AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-frontend-${{ github.run_id }}

      - name: Subir los ficheros con hash
        # Primero los assets y despues el index. Si index.html llegara antes, un
        # navegador podria pedir un bundle que todavia no existe.
        run: |
          aws s3 sync dist/frontend/browser "s3://${{ vars.S3_BUCKET }}" \
            --exclude index.html \
            --cache-control 'public, max-age=31536000, immutable' \
            --delete

      - name: Subir index.html sin cachear
        run: |
          aws s3 cp dist/frontend/browser/index.html \
            "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control 'no-cache, no-store, must-revalidate'

      - name: Invalidar CloudFront
        # Solo index.html y la raiz: los demas ficheros llevan hash en el nombre,
        # asi que su contenido no cambia nunca e invalidarlos seria pagar por nada.
        run: |
          aws cloudfront create-invalidation \
            --distribution-id '${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}' \
            --paths '/index.html' '/' \
            --no-cli-pager

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: La SPA se sirve
        run: |
          curl -fsS --retry 5 --retry-delay 5 -o /dev/null \
            "${{ vars.PUBLIC_BASE_URL }}/"

      - name: Una ruta profunda devuelve la SPA y no un 404
        # Comprueba la custom error response de CloudFront, que es el equivalente
        # del try_files de nginx. Sin ella, recargar en /factorization da 404.
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' \
            "${{ vars.PUBLIC_BASE_URL }}/factorization")
          echo "GET /factorization -> $codigo"
          [ "$codigo" = "200" ] || exit 1

      - name: Los headers de seguridad estan presentes
        # En local los pone nginx; en produccion, una response headers policy de
        # CloudFront. Es configuracion duplicada, y ya desaparecio una vez sin que
        # nada fallara, asi que se comprueba en cada despliegue.
        run: |
          set -euo pipefail
          headers=$(curl -sI "${{ vars.PUBLIC_BASE_URL }}/")
          for h in x-content-type-options x-frame-options referrer-policy content-security-policy; do
            echo "$headers" | grep -qi "^$h:" || { echo "Falta el header $h"; exit 1; }
          done
          echo "Los headers de seguridad estan presentes"
