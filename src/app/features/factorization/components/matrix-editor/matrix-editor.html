<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="editor__toolbar" role="group" aria-label="Dimensiones de la matriz">
    <span class="editor__dimensions" aria-live="polite">
      {{ rows() }} &times; {{ columns() }}
    </span>

    <div class="editor__actions">
      <button
        matButton="outlined"
        type="button"
        (click)="addRow()"
        [disabled]="!canAddRow()"
        [matTooltip]="
          canAddRow() ? 'Añadir una fila' : 'Máximo ' + maxDimension + ' filas'
        "
      >
        <mat-icon aria-hidden="true">add</mat-icon>
        Fila
      </button>

      <button
        matButton="outlined"
        type="button"
        (click)="removeRow()"
        [disabled]="!canRemoveRow()"
        [matTooltip]="
          canRemoveRow()
            ? 'Eliminar la última fila'
            : 'La factorización QR necesita al menos tantas filas como columnas'
        "
      >
        <mat-icon aria-hidden="true">remove</mat-icon>
        Fila
      </button>

      <button
        matButton="outlined"
        type="button"
        (click)="addColumn()"
        [disabled]="!canAddColumn()"
        [matTooltip]="
          canAddColumn()
            ? 'Añadir una columna'
            : 'Añade primero una fila: la factorización QR necesita filas ≥ columnas'
        "
      >
        <mat-icon aria-hidden="true">add</mat-icon>
        Columna
      </button>

      <button
        matButton="outlined"
        type="button"
        (click)="removeColumn()"
        [disabled]="!canRemoveColumn()"
        [matTooltip]="
          canRemoveColumn() ? 'Eliminar la última columna' : 'La matriz necesita una columna'
        "
      >
        <mat-icon aria-hidden="true">remove</mat-icon>
        Columna
      </button>
    </div>
  </div>

  <div class="editor__grid" formArrayName="grid">
    @for (row of grid.controls; track $index; let rowIndex = $index) {
      <div class="editor__row" [formArrayName]="rowIndex">
        @for (cell of row.controls; track $index; let columnIndex = $index) {
          <mat-form-field appearance="outline" class="editor__cell" subscriptSizing="dynamic">
            <input
              matInput
              type="number"
              step="any"
              [formControlName]="columnIndex"
              [attr.aria-label]="
                'Fila ' + (rowIndex + 1) + ', columna ' + (columnIndex + 1)
              "
            />
          </mat-form-field>
        }
      </div>
    }
  </div>

  @if (form.invalid && form.touched) {
    <p class="editor__error" role="alert">
      Todas las celdas deben contener un número finito.
    </p>
  }

  <button matButton="filled" type="submit" [disabled]="isBusy()">
    <mat-icon aria-hidden="true">functions</mat-icon>
    Factorizar
  </button>
</form>
