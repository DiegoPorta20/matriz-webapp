<div class="flex min-h-screen flex-col">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-6xl items-center gap-3 px-4">
      <span class="flex size-9 items-center justify-center rounded-lg bg-blue-700 text-white">
        <i class="material-icons text-xl" aria-hidden="true">functions</i>
      </span>

      <div class="min-w-0">
        <p class="truncate text-sm font-semibold text-slate-900">Factorización QR</p>
        <p class="truncate text-xs text-slate-500">Descomposición de matrices</p>
      </div>

      <button class="btn btn-ghost ml-auto" type="button" (click)="logout()">
        <i class="material-icons text-lg" aria-hidden="true">logout</i>
        Salir
      </button>
    </div>
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>
</div>
